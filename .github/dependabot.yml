version: 2
updates:
  # One npm ecosystem for the whole workspace (root package-lock.json).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    # Majors arrive one by one, so their breaking changes can be read and tested.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
